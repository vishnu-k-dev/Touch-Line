name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: touchline, POSTGRES_PASSWORD: local_dev_password, POSTGRES_DB: touchline }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U touchline -d touchline" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://touchline:local_dev_password@localhost:5432/touchline
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: apps/api/requirements.txt }
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/models
          key: data-${{ hashFiles('data/samples/selected_matches.json') }}
      - run: pip install -r requirements.txt
      - name: Migrate, then check the models and the migrations agree
        run: |
          python -c "from app.core.db import init_db; init_db()"
          alembic check
      - name: Load the sample matches and build the search index
        run: python -m app.services.bootstrap
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: touchline, POSTGRES_PASSWORD: local_dev_password, POSTGRES_DB: touchline }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U touchline -d touchline" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://touchline:local_dev_password@localhost:5432/touchline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: apps/api/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/models
          key: data-${{ hashFiles('data/samples/selected_matches.json') }}
      - run: pip install -r apps/api/requirements.txt
      - name: Prepare data and start the API
        working-directory: apps/api
        run: |
          python -m app.services.bootstrap
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health/ready && break || sleep 1; done
      - working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: apps/web/test-results }
